# Replace hostname and certificate paths; enable the allowlist include after editing it.
server {
    listen 80;
    server_name sentinelzone.example.local;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name sentinelzone.example.local;
    ssl_certificate /etc/ssl/sentinelzone/fullchain.pem;
    ssl_certificate_key /etc/ssl/sentinelzone/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    location / {
        # Optional: management/VPN-only access. The snippet must end with deny all.
        # include /etc/nginx/snippets/sentinelzone-allowlist.conf;
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
