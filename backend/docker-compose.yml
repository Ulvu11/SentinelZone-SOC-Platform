services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinelzone}
      POSTGRES_USER: ${POSTGRES_USER:-sentinelzone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a new PostgreSQL password in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
    env_file: [.env]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?set a postgresql+psycopg URL; use hostname postgres for Compose}
    ports: ["127.0.0.1:8003:8003"]
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8003/health',timeout=3)); assert r['database']=='healthy'"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
volumes:
  pgdata:
